本規約は、プロテックス・ジャパン合同会社（以下「当社」）が運営するライバー事務所「ANGEL LIVE」に所属するライバー（以下「ライバー」）と当社との間の業務委託契約の内容を定めるものです。

第1条（契約の性質）
1. 本契約は業務委託契約であり、雇用契約ではありません。ライバーは個人事業主として、自らの裁量で配信活動を行います。
2. 当社はライバーに対し、配信の日時・時間・内容を強制しません。本規約に定める報酬区分およびミッションは、活動実績に応じた報酬算定の基準であり、稼働義務を課すものではありません。

第2条（所属資格）
1. ライバーは18歳以上であることを要します。
2. 暴力団その他反社会的勢力に該当する者、過去に配信プラットフォームから重大な規約違反処分を受けた者は所属できません。

第3条（報酬）
1. 報酬は、所属時に当社とライバーが合意した採用区分（時給型・固定型・完全歩合型のいずれか）に基づき算定します。区分および単価は所属時に個別に明示します。
   一、時給型：合意した時給単価 × 当社が記録した配信時間
   二、固定型：合意した月額固定報酬
   三、完全歩合型：配信により獲得したダイヤの換算額（換算レートは当社が事前に明示） × 還元率100%
2. 報酬は毎月末日締めとし、翌月末日に報酬額を確定のうえ、確定後最初に到来する10日までにライバー指定の銀行口座へ振り込みます。振込手数料は当社が負担します。
3. 報酬の算定基礎となる配信実績は当社が記録・管理し、ライバーはマイページでいつでも確認できます。実績に疑義がある場合、ライバーは記録日から30日以内に申し出ることができます。

第4条（Angel Points）
1. 当社は、報酬とは別のインセンティブとして、当社が定める基準（配信実績・ミッション達成等）によりAngel Points（以下「ポイント」）を付与します。付与基準はマイページ上に表示します。
2. ライバーは、保有ポイントを1,000ポイント以上1,000ポイント単位で現金化申請できます。換算レートは申請ポイント数に応じ、次のとおりとします。
   一、5,000ポイントまで：1,000ポイントあたり500円
   二、5,001〜20,000ポイント：1,000ポイントあたり700円
   三、20,001〜30,000ポイント：1,000ポイントあたり850円
   四、30,001ポイント以上：1,000ポイントあたり1,000円
3. 現金化申請された金額は、申請時点の翌回の報酬支払に合算して支払います。
4. 換算レートおよび付与基準を変更する場合、当社は変更の30日前までにライバーへ通知します。変更前に申請済みのポイントには変更前のレートを適用します。
5. ポイントの有効期限は最終付与日から12ヶ月とします。期限経過後のポイントは失効します。
6. ポイントは契約終了と同時にすべて失効します。契約終了前に現金化申請済みの金額は、第3条に従い最終報酬と併せて支払います。
7. ポイントの第三者への譲渡・売買・貸与はできません。

第5条（ミッション）
1. 当社はライバーごとにミッション（達成条件と報酬ポイントを定めた課題）を提示することがあります。
2. ミッションの達成認定は、当社が実績記録に基づき行います。認定と同時に報酬ポイントを付与します。
3. ミッションへの参加は任意であり、未達成によるペナルティはありません。

第6条（紹介制度）
1. ライバーが新たなライバー（以下「被紹介者」）を当社に紹介し、被紹介者が所属後に累計200時間の配信を達成した場合、当社は紹介者および被紹介者の双方に10,000ポイントを付与します。
2. 紹介関係は被紹介者の所属手続時に当社へ申告されたものに限り認定します。所属後の追加申告は認定できません。
3. 同一人物による複数登録、実態のない紹介、その他不正な手段による紹介と当社が判断した場合、当社はポイントの付与を取り消すことができます。

第7条（ライバーの遵守事項）
ライバーは次の行為をしてはなりません。
一、配信プラットフォームの利用規約・法令に違反する配信（アダルトコンテンツの配信、薬機法・景品表示法に抵触する宣伝行為を含む）
二、実績の虚偽申告、不正なダイヤ・ポイントの取得行為
三、当社、他のライバー、視聴者その他第三者の名誉・信用を毀損する行為
四、当社の事前承諾なく、当社との契約内容・報酬額等の機密情報を第三者に開示する行為
五、視聴者との間で、配信プラットフォームを介さない私的な金銭授受を行うこと、または視聴者に私的な面会・連絡先交換を強要すること

第8条（アカウントとコンテンツの取扱い）
1. ライバーが配信に使用するアカウントはライバー個人に帰属し、契約終了後もライバーが引き続き保有します。
2. 配信コンテンツに関する権利の帰属は、配信プラットフォームの規約に従います。
3. ライバーは、当社がANGEL LIVEの宣伝・ライバー募集のためにライバーの活動名・配信画像等を利用することを許諾します。ライバーはいつでも将来に向かってこの許諾を撤回できます。

第9条（個人情報）
当社は、ライバーの個人情報（本人情報・振込先等）を、報酬支払・連絡・法令上の義務の履行の目的でのみ利用し、法令に基づく場合を除き第三者に提供しません。

第10条（契約期間と終了）
1. 本契約の期間は定めのないものとし、ライバー・当社のいずれも、1ヶ月前までに通知することで契約を終了できます。
2. 相手方に本規約の重大な違反があった場合、催告のうえ直ちに契約を解除できます。
3. 契約終了時の報酬・ポイントは第3条・第4条に従い精算します。契約終了を理由とする違約金は発生しません。

第11条（損害賠償）
1. ライバーまたは当社が本規約に違反して相手方に損害を与えた場合、現実に生じた直接かつ通常の損害の範囲で賠償責任を負います。
2. ライバーがアダルトコンテンツの配信その他配信プラットフォームの規約に違反する行為により、アカウントの停止・凍結等の処分を受け、これにより当社に損害が生じた場合、当社はライバーに対し当該損害の賠償を請求することがあります。

第12条（税務）
報酬およびポイント現金化額に係る税務申告は、ライバー自身の責任で行うものとします。当社は法令上必要な場合、源泉徴収および支払調書の提出を行います。

第13条（規約の変更）
当社が本規約を変更する場合、効力発生日の30日前までにライバーへ通知します。変更に同意できないライバーは、効力発生日までに契約を終了でき、この場合も第10条第3項の精算を行います。

第14条（協議・管轄）
本規約に定めのない事項は両者誠実に協議して定めます。本契約は日本法に準拠し、紛争は京都地方裁判所を第一審の専属的合意管轄裁判所とします。
